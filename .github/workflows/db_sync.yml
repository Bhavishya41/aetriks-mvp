name: Database Synchronization

on:
  schedule:
    # Run every 5 days at midnight UTC
    - cron: '0 0 */5 * *'
  workflow_dispatch: # Allow manual triggering from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # Cache pip dependencies

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install google-genai # Ensure latest SDK is installed

      - name: Create GEE Key File
        run: |
          echo '${{ secrets.GEE_KEY_FILE_CONTENT }}' > backend/gee-key.json

      - name: Run Database Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEE_SERVICE_ACCOUNT: ${{ secrets.GEE_SERVICE_ACCOUNT }}
          GEE_KEY_FILE: gee-key.json
          # If backend is deployed to a service like Render:
          # BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          python backend/cron_sync.py
